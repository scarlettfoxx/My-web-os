<!DOCTYPE html>
<html>
<head>
<title>Web OS</title>
<style>
body {
margin: 0;
height: 100vh;
background: url('https://unsplash.com/photos/palm-fronds-in-black-and-white-PCGUrksMfZQ') no-repeat center center fixed;
background-size: cover;
font-family: Arial, sans-serif;
overflow: hidden;
color: white;
}

.desktop {
padding: 40px 30px;
display: flex;
flex-direction: column;
gap: 25px;
width: 120px;
}

.icon {
width: 100px;
text-align: center;
cursor: pointer;
}

.icon img {
width: 70px;
height: 70px;
border-radius: 14px;
margin: 0 auto 8px;
display: block;
object-fit: cover;
}

.icon span {
font-size: 13px;
}

.taskbar {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 50px;
background-color: rgba(0, 0, 0, 0.7);
display: flex;
align-items: center;
padding-left: 12px;
}

.start-btn {
background-color: #14b8a6;
border: none;
color: white;
padding: 8px 16px;
border-radius: 6px;
cursor: pointer;
font-size: 14px;
font-weight: bold;
}

.start-btn:hover {
background-color: #0d9488;
}

.clock {
margin-left: auto;
margin-right: 20px;
font-size: 14px;
}

.window {
position: absolute;
top: 80px;
left: 150px;
width: 320px;
background-color: #1e3a3a;
border: 2px solid #14b8a6;
border-radius: 10px;
display: none;
z-index: 10;
color: white;
box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.window-header {
background-color: #14b8a6;
padding: 10px 15px;
display: flex;
justify-content: space-between;
align-items: center;
border-radius: 8px 8px 0 0;
font-weight: bold;
}

.window-body {
padding: 15px;
}

.close-btn {
background: none;
border: none;
color: white;
font-size: 18px;
cursor: pointer;
}

/* Calculator styles */
#calcDisplay {
width: 100%;
height: 50px;
font-size: 24px;
text-align: right;
padding: 10px;
margin-bottom: 10px;
border: none;
border-radius: 6px;
background-color: #0f2a2a;
color: white;
box-sizing: border-box;
}

.calc-buttons {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 8px;
}

.calc-buttons button {
padding: 15px;
font-size: 18px;
border: none;
border-radius: 6px;
background-color: #134e4a;
color: white;
cursor: pointer;
}

.calc-buttons button:hover {
background-color: #0d9488;
}

.calc-buttons .equals {
background-color: #14b8a6;
grid-column: span 2;
}
</style>
</head>
<body>

<!-- Desktop Icons -->
<div class="desktop">
<div class="icon" onclick="openWindow('filesWindow')">
<img src="files.png" alt="Files">
<span>Files</span>
</div>

<div class="icon" onclick="openWindow('browserWindow')">
<img src="browser.png" alt="Browser">
<span>Browser</span>
</div>

<div class="icon" onclick="openWindow('settingsWindow')">
<img src="settings.jpeg" alt="Settings">
<span>Settings</span>
</div>

<div class="icon" onclick="openWindow('calcWindow')">
<img src="calculator.png" alt="Calculator">
<span>Calculator</span>
</div>
</div>

<!-- Files Window -->
<div class="window" id="filesWindow">
<div class="window-header">
<span>Files</span>
<button class="close-btn" onclick="closeWindow('filesWindow')">×</button>
</div>
<div class="window-body">
<p>📁 Documents</p>
<p>📁 Downloads</p>
<p>📁 Pictures</p>
<p>📁 Music</p>
</div>
</div>

<!-- Browser Window -->
<div class="window" id="browserWindow">
<div class="window-header">
<span>Browser</span>
<button class="close-btn" onclick="closeWindow('browserWindow')">×</button>
</div>
<div class="window-body">
<p>Search the web:</p>
<input type="text" placeholder="Type something..." style="width: 90%; padding: 8px; margin-top: 10px; border-radius: 6px; border: none;">
</div>
</div>

<!-- Settings Window -->
<div class="window" id="settingsWindow">
<div class="window-header">
<span>Settings</span>
<button class="close-btn" onclick="closeWindow('settingsWindow')">×</button>
</div>
<div class="window-body">
<p>What can I help you with?</p>
<p style="margin-top: 15px;">• Display</p>
<p>• Sound</p>
<p>• Wallpaper</p>
<p>• About</p>
</div>
</div>

<!-- Calculator Window -->
<div class="window" id="calcWindow">
<div class="window-header">
<span>Calculator</span>
<button class="close-btn" onclick="closeWindow('calcWindow')">×</button>
</div>
<div class="window-body">
<input type="text" id="calcDisplay" disabled>
<div class="calc-buttons">
<button onclick="appendCalc('7')">7</button>
<button onclick="appendCalc('8')">8</button>
<button onclick="appendCalc('9')">9</button>
<button onclick="appendCalc('/')">/</button>

<button onclick="appendCalc('4')">4</button>
<button onclick="appendCalc('5')">5</button>
<button onclick="appendCalc('6')">6</button>
<button onclick="appendCalc('*')">*</button>

<button onclick="appendCalc('1')">1</button>
<button onclick="appendCalc('2')">2</button>
<button onclick="appendCalc('3')">3</button>
<button onclick="appendCalc('-')">-</button>

<button onclick="appendCalc('0')">0</button>
<button onclick="appendCalc('.')">.</button>
<button onclick="clearCalc()">C</button>
<button onclick="appendCalc('+')">+</button>

<button class="equals" onclick="calculate()">=</button>
</div>
</div>
</div>

<!-- Taskbar -->
<div class="taskbar">
<button class="start-btn">Start</button>
<div class="clock" id="clock">00:00</div>
</div>

<script>
function updateClock() {
const now = new Date();
let hours = now.getHours();
let minutes = now.getMinutes();

if (minutes < 10) {
minutes = "0" + minutes;
}

document.getElementById("clock").textContent = hours + ":" + minutes;
}

updateClock();
setInterval(updateClock, 1000);

function openWindow(id) {
document.getElementById(id).style.display = "block";
}

function closeWindow(id) {
document.getElementById(id).style.display = "none";
}

// Calculator functions
function appendCalc(value) {
document.getElementById("calcDisplay").value += value;
}

function clearCalc() {
document.getElementById("calcDisplay").value = "";
}

function calculate() {
try {
const result = eval(document.getElementById("calcDisplay").value);
document.getElementById("calcDisplay").value = result;
} catch (e) {
document.getElementById("calcDisplay").value = "Error";
}
}
</script>

</body>
</html>

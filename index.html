<!DOCTYPE html>
<html>
<head>
<title>Web OS</title>
<style>
body {
margin: 0;
height: 100vh;
background: url('https://images.unsplash.com/photo-1793583019770-e4fe445dacbe?q=80&w=1470&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D') no-repeat center center fixed;
background-size: cover;
font-family: Arial, sans-serif;
overflow: hidden;
color: white;
}

.desktop {
padding: 40px 30px;
display: flex;
flex-direction: column;
gap: 25px;
width: 120px;
}

.icon {
width: 100px;
text-align: center;
  cursor: pointer;
}

.icon-box {
width: 70px;
height: 70px;
border-radius: 14px;
margin: 0 auto 8px;
}

.icon span {
font-size: 13px;
}

.taskbar {
position: fixed;
bottom: 0;
left: 0;
width: 100%;
height: 50px;
background-color: rgba(0, 0, 0, 0.7);
display: flex;
align-items: center;
padding-left: 12px;
}

.start-btn {
background-color: #14b8a6;
border: none;
color: white;
padding: 8px 16px;
border-radius: 6px;
cursor: pointer;
font-size: 14px;
font-weight: bold;
}

.start-btn:hover {
background-color: #0d9488;
}

.clock {
margin-left: auto;
margin-right: 20px;
font-size: 14px;
}
</style>
</head>
<body>

<div class="desktop">
<div class="icon">
<img class="icon-box" src="computer.jpeg" alt="computer">
<span>Computer</span>
</div>

<div class="icon">
<img class="icon-box" src="files.png" alt="Files">
<span>Files</span>
</div>

<div class="icon">
<img class="icon-box" src="browser.png" alt="Browser">
<span>Browser</span>
</div>

<div class="icon">
<img class="icon-box" src="settings.jpeg" alt="Settings">
<span>Settings</span>
</div>
</div>

<div class="taskbar">
<button class="start-btn">Start</button>
<div class="clock" id="clock">00:00</div>
</div>

<script>
function updateClock() {
const now = new Date();
let hours = now.getHours();
let minutes = now.getMinutes();

if (minutes < 10) {
minutes = "0" + minutes;
}

document.getElementById("clock").textContent = hours + ":" + minutes;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
